server {
    listen 80 default_server;
    server_name _;
    root /var/www/bank;
    index index.php;
    client_max_body_size 8m;

    # Prohori-managed mitigation snippets (e.g. block-multipart.conf) are dropped here.
    include /etc/nginx/prohori/*.conf;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    location ^~ /uploads/ { deny all; }
}
